<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1 id="klant-naam">Bestelportaal</h1>
    <div style="display: flex; gap: 16px; align-items: center">
      <a href="#" id="link-bestellingen">Mijn bestellingen</a>
      <button class="link" id="uitloggen">Uitloggen</button>
    </div>
  </div>

  <main class="inhoud">
    <div class="catalogus-layout">
      <section id="bestel-paneel">
        <div id="producten-body"></div>
      </section>

      <aside class="cart-kaart">
        <h2 style="font-size: 1rem; margin-top: 0">Winkelwagen</h2>
        <ul id="cart-lijst" class="cart-lijst"></ul>
        <div class="cart-totaalregel">
          <span>Totaal</span>
          <strong id="cart-totaal">€ 0,00</strong>
        </div>
        <p class="cart-info">Levering op: <strong id="leverdatum">-</strong></p>
        <p class="melding-fout" id="minimum-melding"></p>
        <form id="bestel-form">
          <button type="submit" id="bestel-knop" disabled>Bestelling plaatsen</button>
          <p class="melding-fout" id="bestel-fout"></p>
        </form>
      </aside>

      <div id="bevestiging" class="kaart" hidden style="max-width: 480px">
        <h2 style="font-size: 1.1rem">Bestelling ontvangen</h2>
        <p id="bevestiging-tekst"></p>
        <p>
          <a href="bestellingen.html">Bekijk mijn bestellingen</a>
        </p>
        <button id="nieuwe-bestelling">Nieuwe bestelling starten</button>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/github-api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/bestel-utils.js"></script>
  <script>
    const klantIdVoorLink = new URLSearchParams(window.location.search).get("klant") || "";
    document.getElementById("link-bestellingen").href = `bestellingen.html?klant=${encodeURIComponent(klantIdVoorLink)}`;
  </script>
  <script src="js/catalogus.js"></script>
</body>
</html>
