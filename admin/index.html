<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="pagina-login">
    <div class="kaart">
      <h1>Admin</h1>
      <p class="sub">Beheer van klanten, producten en bestellingen.</p>

      <form id="login-form">
        <label for="pincode">Pincode</label>
        <input
          type="password"
          id="pincode"
          inputmode="numeric"
          autocomplete="off"
          autofocus
          required
        />
        <div class="melding-fout" id="melding-fout"></div>
        <button type="submit" id="login-knop">Inloggen</button>
      </form>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    if (Auth.adminSessie()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const knop = document.getElementById("login-knop");
      const foutveld = document.getElementById("melding-fout");
      const pincode = document.getElementById("pincode").value;

      foutveld.textContent = "";
      knop.disabled = true;
      knop.textContent = "Bezig...";

      try {
        const result = await Auth.loginAdmin(pincode);
        if (!result.ok) {
          foutveld.textContent = result.fout;
          knop.disabled = false;
          knop.textContent = "Inloggen";
          return;
        }
        window.location.href = "dashboard.html";
      } catch (err) {
        foutveld.textContent = "Er ging iets mis. Probeer het opnieuw.";
        knop.disabled = false;
        knop.textContent = "Inloggen";
      }
    });
  </script>
</body>
</html>
