<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Producten</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>Producten</h1>
    <div style="display: flex; gap: 16px; align-items: center">
      <a href="dashboard.html">Terug naar admin</a>
      <button class="link" id="uitloggen">Uitloggen</button>
    </div>
  </div>

  <main class="inhoud">
    <section id="lijst-sectie">
      <button id="nieuw-product-knop" style="width: auto; padding: 10px 18px">+ Nieuw product</button>
      <table class="product-tabel" style="margin-top: 16px">
        <thead>
          <tr>
            <th>Product</th>
            <th>Categorie</th>
            <th>Eenheid</th>
            <th>Inkoopprijs</th>
            <th>Actief</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="producten-body"></tbody>
      </table>
    </section>

    <section id="form-sectie" class="kaart" style="max-width: 480px; margin-top: 24px" hidden>
      <h2 id="form-titel" style="font-size: 1.1rem">Product</h2>
      <form id="product-form">
        <label for="naam">Naam</label>
        <input type="text" id="naam" required />

        <label for="product-id">Productcode (intern)</label>
        <input type="text" id="product-id" required />
        <p class="cart-info" id="product-id-hint"></p>

        <label for="categorie">Categorie</label>
        <input type="text" id="categorie" list="categorie-opties" required />
        <datalist id="categorie-opties"></datalist>

        <label for="eenheid">Eenheid</label>
        <select id="eenheid">
          <option value="stuk">stuk</option>
          <option value="kg">kg</option>
        </select>

        <label for="inkoopprijs">Inkoopprijs</label>
        <input type="number" id="inkoopprijs" min="0" step="0.01" required />

        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px">
          <input type="checkbox" id="actief" style="width: auto; margin: 0" checked />
          Actief (zichtbaar in catalogus, mits ook een prijs bij de klant)
        </label>

        <p class="melding-fout" id="form-fout"></p>
        <div style="display: flex; gap: 12px">
          <button type="submit" id="opslaan-knop">Opslaan</button>
          <button type="button" id="annuleren-knop" style="background: var(--kleur-rand); color: var(--kleur-tekst)">
            Annuleren
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/github-api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/bestel-utils.js"></script>
  <script src="../js/admin-producten.js"></script>
</body>
</html>
