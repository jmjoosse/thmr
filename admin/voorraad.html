<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voorraad</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>Voorraad</h1>
    <div style="display: flex; gap: 16px; align-items: center">
      <a href="dashboard.html">Terug naar admin</a>
      <button class="link" id="uitloggen">Uitloggen</button>
    </div>
  </div>

  <main class="inhoud">
    <p class="cart-info">
      Producten met 0 op voorraad worden niet meer bestelbaar in de catalogus.
      Voorraad wordt niet automatisch verlaagd bij een bestelling — pas dit
      handmatig aan.
    </p>
    <form id="voorraad-form">
      <table class="product-tabel">
        <thead>
          <tr><th>Product</th><th>Eenheid</th><th>Voorraad</th></tr>
        </thead>
        <tbody id="voorraad-body"></tbody>
      </table>
      <p class="melding-fout" id="form-fout"></p>
      <button type="submit" id="opslaan-knop" style="width: auto; padding: 10px 18px; margin-top: 16px">
        Alles opslaan
      </button>
    </form>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/github-api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-voorraad.js"></script>
</body>
</html>
